name: EcoMind CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Backend CI (Unit Tests, Router & Telemetry Validation)
  # ===========================================================================
  backend-ci:
    name: Backend Test Suite & Type Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Test Suite (Unittest Discovery)
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          GOOGLE_API_KEY: "mock-google-ci-token-0000000000"
          GROQ_API_KEY: "gsk_mock_groq_ci_token_0000000000"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  # ===========================================================================
  # Job 2: Frontend CI (TypeScript Validation & Production Vite Build)
  # ===========================================================================
  frontend-ci:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate TypeScript Types
        working-directory: ./frontend
        run: npx tsc -b

      - name: Compile Vite Production Build
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # Job 3: Docker Build Verification (Layer Caching & Multi-Stage Image Builds)
  # Strictly CI verification only: No external registry push or deployment
  # ===========================================================================
  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ecomind-backend:ci
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ecomind-frontend:ci
          build-args: |
            VITE_API_BASE_URL=
          load: true

